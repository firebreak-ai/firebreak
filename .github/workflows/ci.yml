name: CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main, "develop/**"]

jobs:
  python-tests:
    name: Python Behavior and Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: python-tests

      - name: Run pytest
        run: python3 tests/run-tests.py --suite python

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: test-results/
          include-hidden-files: true

  installer-tests:
    name: Installer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: installer-tests

      - name: Run installer tests
        run: python3 tests/run-tests.py --suite installer

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-reports
          path: test-results/
          include-hidden-files: true

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: lint

      - name: Run the lint check
        run: python3 tests/run-tests.py --suite lint

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: test-results/
          include-hidden-files: true
