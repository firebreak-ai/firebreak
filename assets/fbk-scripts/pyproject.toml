[project]
name = "fbk-scripts"
version = "0.5.2"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "flaky_quarantine: marks test as non-gating for wall-clock assertions; timing flakes on shared CI do not block suite",
]
