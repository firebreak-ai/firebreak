behaviors:
  B-001:
    description: Spec carries an Interface contracts section enumerating affected contracts
    prd_reference: prd.md
  B-002:
    description: Interface contracts section includes blast-radius (pre-existing-but-touched) contracts marked as pre-existing
    prd_reference: prd.md
  B-003:
    description: Spec records deliberately-dropped design contracts under an Excluded contracts section with rationale
    prd_reference: prd.md
  B-004:
    description: Spec records acceptance criteria that intentionally have no contract under an Uncovered acceptance criteria section with rationale
    prd_reference: prd.md
  B-005:
    description: Spec gate enforces structural completeness of the Interface contracts section (presence, fields, identifier form, non-empty covers, AC existence)
    prd_reference: prd.md
  B-006:
    description: Spec gate enforces design-anchor check (every design contract id is carried or excluded) with named-item teaching error
    prd_reference: prd.md
  B-007:
    description: Spec gate enforces acceptance-criteria coverage (every AC is covered or uncovered-with-rationale) with named-item teaching error
    prd_reference: prd.md
  B-008:
    description: Spec gate enforces light seam coverage (every integration-seam component pair is named in some contract entry)
    prd_reference: prd.md
  B-009:
    description: Design produces a standardized contracts page on every feature, including features with no contract changes
    prd_reference: prd.md
  B-010:
    description: Spec review elevates contract drift between spec and design and leaves disposition to the operator
    prd_reference: prd.md
